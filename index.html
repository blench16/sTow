<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Minecraft 皮肤生成器</title>
<link rel="icon" href="IMG_9261.jpeg">
<link rel="apple-touch-icon" href="IMG_9261.jpeg">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#f1f5f9;color:#0f172a;padding:24px 14px 48px;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:1040px;margin:0 auto}
header{margin-bottom:20px;padding:0 4px;display:flex;justify-content:space-between;align-items:flex-end}
header h1{font-size:22px;font-weight:700;letter-spacing:-.2px}
header h1 span{color:#0284c7}
header p{color:#64748b;font-size:13px;margin-top:2px;font-weight:500}
.badge-blue{font-size:11px;padding:4px 10px;background:#e0f2fe;color:#0369a1;border:1px solid #bae6fd;border-radius:20px;font-weight:600;letter-spacing:.3px;box-shadow:0 2px 6px rgba(2,132,199,.08)}
main{display:grid;gap:16px;grid-template-columns:1fr;grid-template-areas:"control" "preview" "skin"}
@media(min-width:880px){main{grid-template-columns:320px 1fr;grid-template-areas:"control preview" "skin preview"}}
.panel{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;box-shadow:0 4px 16px rgba(15,23,42,.04)}
.panel-control{grid-area:control}
.panel-preview{grid-area:preview;display:flex;flex-direction:column}
.panel-skin{grid-area:skin}

.upload-zone{display:flex;align-items:center;justify-content:center;min-height:84px;padding:12px;cursor:pointer;background:#f8fafc;border:1.5px dashed #cbd5e1;border-radius:8px;color:#64748b;font-size:13.5px;font-weight:600;transition:all .2s ease;user-select:none}
.upload-zone *{pointer-events:none}
.upload-zone:hover,.upload-zone.dragover{border-color:#38bdf8;background:#f0f9ff;color:#0284c7}
.upload-inner{display:flex;align-items:center;gap:8px}
.avatar-wrap{display:none;align-items:center;gap:14px;width:100%}
.upload-zone.has-image{padding:10px 12px;background:#fff;border-style:solid;border-color:#e2e8f0}
.upload-zone.has-image .upload-inner{display:none}
.upload-zone.has-image .avatar-wrap{display:flex}
.plus{font-size:18px;line-height:1;color:#0284c7;font-weight:600}
.avatar-preview{width:64px;height:64px;flex-shrink:0;image-rendering:pixelated;border-radius:6px;background:#f1f5f9;border:1px solid #cbd5e1}
.avatar-text{font-size:12px;color:#64748b;line-height:1.5}
.avatar-text strong{color:#0f172a;font-weight:700;font-size:13px}

.field{margin-top:16px}
.field>label{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:8px;letter-spacing:.2px}
.segmented{display:flex;gap:4px;background:#f1f5f9;padding:4px;border-radius:8px;border:1px solid #e2e8f0}
.segmented button{flex:1;padding:8px 4px;font-size:12.5px;font-family:inherit;font-weight:600;color:#64748b;background:transparent;border:none;border-radius:6px;cursor:pointer;transition:all .15s;white-space:nowrap}
.segmented button:hover{color:#0f172a}
.segmented button.active{background:#fff;color:#0f172a;box-shadow:0 2px 5px rgba(0,0,0,.06)}

.preview-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.preview-head h3{font-size:13px;font-weight:700;letter-spacing:.4px}
.stage{position:relative;flex:1;min-height:380px;perspective:1200px;perspective-origin:50% 46%;border-radius:10px;background:radial-gradient(circle at 50% 40%,#fff 0%,#e2e8f0 100%);border:1px solid #e2e8f0;overflow:hidden;user-select:none}
@media(min-width:880px){.stage{min-height:440px}}
.stage-tools{position:absolute;top:12px;right:12px;z-index:10;display:flex;gap:6px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:4px;border-radius:8px;border:1px solid #e2e8f0;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.tool-btn{padding:5px 9px;font-size:11.5px;font-weight:600;font-family:inherit;color:#475569;background:transparent;border:none;border-radius:5px;cursor:pointer;transition:all .15s}
.tool-btn:hover{color:#0f172a;background:#f1f5f9}
.tool-btn.active{background:#e0f2fe;color:#0369a1}
.stage::before{content:'';position:absolute;left:50%;top:calc(50% + 110px);width:220px;height:220px;transform:translate(-50%,-50%) rotateX(75deg);border-radius:50%;border:1px dashed rgba(0,0,0,.08);pointer-events:none}
.stage::after{content:'';position:absolute;left:50%;top:calc(50% + 110px);width:160px;height:20px;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(0,0,0,.12) 0%,transparent 70%);pointer-events:none}
.model,.part,.swing{position:absolute;left:0;top:0;width:0;height:0;-webkit-transform-style:preserve-3d;transform-style:preserve-3d}
.model{left:50%;top:50%;will-change:transform}
.swing{transform-origin:0 0}
.face{position:absolute;background-repeat:no-repeat;image-rendering:pixelated;image-rendering:crisp-edges;-webkit-backface-visibility:hidden;backface-visibility:hidden;cursor:grab;touch-action:none}
.face:active{cursor:grabbing}
.stage-hint{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;padding:5px 14px;background:#e0f2fe;color:#0369a1;border:1px solid #bae6fd;border-radius:20px;font-size:11.5px;font-weight:600;letter-spacing:.2px;pointer-events:none;box-shadow:0 2px 8px rgba(3,105,161,.08);white-space:nowrap}

.skin-result{display:flex;align-items:center;gap:16px}
@media(min-width:880px){.skin-result{flex-direction:column}}
#skinCanvas{width:120px;height:120px;image-rendering:pixelated;border-radius:8px;border:1px solid #cbd5e1;flex-shrink:0;background:linear-gradient(45deg,#f1f5f9 25%,transparent 25%,transparent 75%,#f1f5f9 75%),linear-gradient(45deg,#f1f5f9 25%,#fff 25%,#fff 75%,#f1f5f9 75%);background-size:16px 16px;background-position:0 0,8px 8px}
@media(min-width:880px){#skinCanvas{width:180px;height:180px}}
.skin-info{display:flex;flex-direction:column;gap:12px;flex:1;width:100%}
.skin-meta{font-size:12px;font-weight:600;color:#64748b;letter-spacing:.2px}
#downloadBtn{padding:11px 18px;font-size:13.5px;font-family:inherit;font-weight:700;color:#0f172a;background:#fff;border:1px solid #cbd5e1;border-radius:8px;cursor:pointer;transition:all .15s;width:100%;box-shadow:0 2px 5px rgba(0,0,0,.03)}
#downloadBtn:hover:not(:disabled){background:#f8fafc;border-color:#94a3b8}
#downloadBtn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="title-wrap">
      <h1>Minecraft <span>皮肤生成器</span></h1>
      <p>上传图片 · 高清转化 · 3D 动态渲染</p>
    </div>
    <div class="badge-blue">MC 1.8+ 皮肤规范</div>
  </header>

  <main>
    <section class="panel panel-control">
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="fileInput" accept="image/*" hidden>
        <div class="upload-inner"><span class="plus">+</span><span>上传角色/照片图像</span></div>
        <div class="avatar-wrap">
          <img id="avatarPreview" class="avatar-preview" alt="">
          <div class="avatar-text"><strong>贴图生成完毕</strong><br>点击更换源图片</div>
        </div>
      </div>

      <div class="field">
        <label>分辨率规格</label>
        <div class="segmented" id="sizeGroup">
          <button data-val="64" class="active">64 × 64 (标准)</button>
          <button data-val="128">128 × 128 (高清)</button>
        </div>
      </div>

      <div class="field">
        <label>手臂模型身形</label>
        <div class="segmented" id="bodyGroup">
          <button data-val="0" class="active">经典 (Steve)</button>
          <button data-val="1">纤细 (Alex)</button>
        </div>
      </div>
    </section>

    <section class="panel panel-preview">
      <div class="preview-head"><h3>3D 实时视图</h3></div>
      <div class="stage" id="stage">
        <div class="stage-tools">
          <button class="tool-btn active" id="poseReset">立正</button>
          <button class="tool-btn" id="poseWalk">行走</button>
          <button class="tool-btn" id="poseRun">跑步</button>
          <button class="tool-btn" id="poseWave">招呼</button>
        </div>
        <div class="model" id="model"></div>
        <div class="stage-hint">按住拖动旋转镜头 · 点住四肢单独旋转</div>
      </div>
    </section>

    <section class="panel panel-skin">
      <div class="preview-head"><h3>展开贴图</h3></div>
      <div class="skin-result">
        <canvas id="skinCanvas" width="64" height="64"></canvas>
        <div class="skin-info">
          <div class="skin-meta" id="skinMeta">等待加载图片</div>
          <button id="downloadBtn" disabled>下载 PNG 皮肤</button>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
const U = 7;
let srcCanvas = null, currentSize = 64, currentSlim = false, skinURL = '';

const limbAngles = {
  armR: {x: 0, z: 0}, armL: {x: 0, z: 0},
  legR: {x: 0, z: 0}, legL: {x: 0, z: 0}
};

// 源图各部位取样区域 [x, y, w, h]（0~1）
const SRC_BOX = {
  head: [0.30, 0.00, 0.40, 0.30],
  body: [0.30, 0.30, 0.40, 0.30],
  armR: [0.05, 0.30, 0.22, 0.30],
  armL: [0.73, 0.30, 0.22, 0.30],
  legR: [0.30, 0.62, 0.18, 0.36],
  legL: [0.52, 0.62, 0.18, 0.36]
};

// 仅用于 3D 预览的面明暗，不写入导出的皮肤
const SHADE = {front: 1, back: .82, right: .88, left: .88, top: 1.08, bottom: .72};

/* ---------- 贴图布局 ----------
   (ox, oy) 是该部位在 64×64 贴图上的展开起点。
   w/h/d = 正面宽 / 高 / 侧面深。侧面宽度恒为 d（手臂侧面始终 4px，
   纤细模式只有正面、背面、顶底面是 3px）。 */
function box(ox, oy, w, h, d, k) {
  const f = (x, y, a, b) => [x, y, a, b].map(v => Math.round(v * k));
  return {
    size: [w, h, d],
    faces: {
      top:    f(ox + d,         oy,     w, d),
      bottom: f(ox + d + w,     oy,     w, d),
      right:  f(ox,             oy + d, d, h),
      front:  f(ox + d,         oy + d, w, h),
      left:   f(ox + d + w,     oy + d, d, h),
      back:   f(ox + 2 * d + w, oy + d, w, h)
    }
  };
}

function getLayout(slim, k) {
  const aw = slim ? 3 : 4;
  return {
    head: box(0, 0, 8, 8, 8, k),
    body: box(16, 16, 8, 12, 4, k),
    armR: box(40, 16, aw, 12, 4, k),
    armL: box(32, 48, aw, 12, 4, k),
    legR: box(0, 16, 4, 12, 4, k),
    legL: box(16, 48, 4, 12, 4, k)
  };
}

/* ---------- 图像处理 ---------- */
function normalizeImage(img) {
  const S = 256;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff';            // 透明区域铺白底，避免变黑
  ctx.fillRect(0, 0, S, S);
  const side = Math.min(img.width, img.height);
  ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, S, S);
  return c;
}

function medianCut(colors, depth) {
  if (depth === 0 || colors.length <= 1) {
    let r = 0, g = 0, b = 0;
    for (const c of colors) { r += c[0]; g += c[1]; b += c[2]; }
    const n = colors.length || 1;
    return [[Math.round(r / n), Math.round(g / n), Math.round(b / n)]];
  }
  let mn = [255, 255, 255], mx = [0, 0, 0];
  for (const c of colors) {
    for (let i = 0; i < 3; i++) {
      if (c[i] < mn[i]) mn[i] = c[i];
      if (c[i] > mx[i]) mx[i] = c[i];
    }
  }
  const rg = [mx[0] - mn[0], mx[1] - mn[1], mx[2] - mn[2]];
  const axis = rg[1] >= rg[0] && rg[1] >= rg[2] ? 1 : (rg[2] >= rg[0] && rg[2] >= rg[1] ? 2 : 0);
  colors.sort((a, b) => a[axis] - b[axis]);
  const mid = colors.length >> 1;
  return [...medianCut(colors.slice(0, mid), depth - 1), ...medianCut(colors.slice(mid), depth - 1)];
}

function nearestColor(c, palette) {
  let best = palette[0], bestD = Infinity;
  for (const p of palette) {
    const d = (p[0] - c[0]) ** 2 + (p[1] - c[1]) ** 2 + (p[2] - c[2]) ** 2;
    if (d < bestD) { bestD = d; best = p; }
  }
  return best;
}

function makeSkin(S, slim) {
  const SW = srcCanvas.width, SH = srcCanvas.height;
  const data = srcCanvas.getContext('2d').getImageData(0, 0, SW, SH).data;

  // 对整个取样格子求平均（原先只取 2×2 个点，噪点大）
  function sampleArea(u0, v0, u1, v1) {
    const x0 = Math.min(SW - 1, Math.floor(u0 * SW));
    const y0 = Math.min(SH - 1, Math.floor(v0 * SH));
    const x1 = Math.min(SW, Math.max(x0 + 1, Math.ceil(u1 * SW)));
    const y1 = Math.min(SH, Math.max(y0 + 1, Math.ceil(v1 * SH)));
    let r = 0, g = 0, b = 0, n = 0;
    for (let y = y0; y < y1; y++) {
      for (let x = x0; x < x1; x++) {
        const i = (y * SW + x) * 4;
        r += data[i]; g += data[i + 1]; b += data[i + 2]; n++;
      }
    }
    return [r / n, g / n, b / n];
  }

  const layout = getLayout(slim, S / 64);
  const samples = [];

  for (const name in SRC_BOX) {
    const bx = SRC_BOX[name], faces = layout[name].faces;
    for (const fn in faces) {
      const [dx, dy, dw, dh] = faces[fn];
      for (let y = 0; y < dh; y++) {
        for (let x = 0; x < dw; x++) {
          samples.push({
            px: dx + x, py: dy + y,
            color: sampleArea(
              bx[0] + (x / dw) * bx[2],       bx[1] + (y / dh) * bx[3],
              bx[0] + ((x + 1) / dw) * bx[2], bx[1] + ((y + 1) / dh) * bx[3]
            )
          });
        }
      }
    }
  }

  const palette = medianCut(samples.map(s => s.color), 5);

  const out = document.createElement('canvas');
  out.width = out.height = S;
  const ctx = out.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  for (const s of samples) {
    const c = nearestColor(s.color, palette);
    ctx.fillStyle = 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
    ctx.fillRect(s.px, s.py, 1, 1);
  }
  return out;
}

function makeAvatar(skin) {
  const k = skin.width / 64, p = Math.round(8 * k);
  const c = document.createElement('canvas');
  c.width = c.height = 72;
  const cx = c.getContext('2d');
  cx.imageSmoothingEnabled = false;
  cx.drawImage(skin, p, p, p, p, 0, 0, 72, 72);
  return c;
}

/* ---------- 3D 模型 ---------- */
// 用叠加半透明黑/白层模拟面明暗，只影响预览
function shadeLayer(b) {
  const c = b < 1 ? '0,0,0,' + (1 - b) : '255,255,255,' + (b - 1);
  return 'linear-gradient(rgba(' + c + '),rgba(' + c + '))';
}

function buildModel(slim, url) {
  const model = document.getElementById('model');
  model.innerHTML = '';

  const layout = getLayout(slim, currentSize / 64);
  const k = currentSize / 64;
  const armX = 4 + (slim ? 3 : 4) / 2;

  const parts = [
    {key: 'head', pos: [0, 28, 0]},
    {key: 'body', pos: [0, 18, 0]},
    {key: 'armR', pos: [-armX, 24, 0], joint: true},
    {key: 'armL', pos: [ armX, 24, 0], joint: true},
    {key: 'legR', pos: [-2, 12, 0], joint: true},
    {key: 'legL', pos: [ 2, 12, 0], joint: true}
  ];

  function createCube(key) {
    const def = layout[key];
    const [w, h, d] = def.size;
    const part = document.createElement('div');
    part.className = 'part';

    const faceDefs = [
      {n: 'front',  w: w, h: h, t: 'rotateY(0deg) translateZ('    + (d / 2 * U) + 'px)'},
      {n: 'back',   w: w, h: h, t: 'rotateY(180deg) translateZ('  + (d / 2 * U) + 'px)'},
      {n: 'right',  w: d, h: h, t: 'rotateY(90deg) translateZ('   + (w / 2 * U) + 'px)'},
      {n: 'left',   w: d, h: h, t: 'rotateY(-90deg) translateZ('  + (w / 2 * U) + 'px)'},
      {n: 'top',    w: w, h: d, t: 'rotateX(90deg) translateZ('   + (h / 2 * U) + 'px)'},
      {n: 'bottom', w: w, h: d, t: 'rotateX(-90deg) translateZ('  + (h / 2 * U) + 'px)'}
    ];

    faceDefs.forEach(function (fd) {
      const uv = def.faces[fd.n];
      const el = document.createElement('div');
      el.className = 'face';
      const fw = fd.w * U, fh = fd.h * U;
      el.style.width = fw + 'px';
      el.style.height = fh + 'px';
      el.style.left = (-fw / 2) + 'px';
      el.style.top = (-fh / 2) + 'px';
      el.style.transform = fd.t;
      el.style.backgroundImage = shadeLayer(SHADE[fd.n]) + ',url("' + url + '")';
      el.style.backgroundSize = '100% 100%,' + (64 * U) + 'px ' + (64 * U) + 'px';
      el.style.backgroundPosition = '0 0,' + (-uv[0] / k * U) + 'px ' + (-uv[1] / k * U) + 'px';
      part.appendChild(el);
    });
    return {part: part, h: h};
  }

  parts.forEach(function (p) {
    const cube = createCube(p.key);
    const move = 'translate3d(' + (p.pos[0] * U) + 'px,' + (-p.pos[1] * U) + 'px,' + (p.pos[2] * U) + 'px)';

    if (p.joint) {
      cube.part.style.transform = 'translate3d(0,' + ((cube.h / 2) * U) + 'px,0)';
      cube.part.dataset.limb = p.key;

      const swing = document.createElement('div');
      swing.className = 'swing';
      swing.dataset.swing = p.key;
      swing.appendChild(cube.part);

      const pivot = document.createElement('div');
      pivot.className = 'part';
      pivot.style.transform = move;
      pivot.appendChild(swing);
      model.appendChild(pivot);
    } else {
      cube.part.style.transform = move;
      model.appendChild(cube.part);
    }
  });

  for (const side in limbAngles) applyLimbAngle(side);
}

function applyLimbAngle(side) {
  const swing = document.querySelector('[data-swing="' + side + '"]');
  if (swing) {
    const a = limbAngles[side];
    swing.style.transform = 'rotateX(' + a.x + 'deg) rotateZ(' + a.z + 'deg)';
  }
}

/* ---------- 交互 ---------- */
function probe(cx, cy, offsets, test) {
  for (const o of offsets) {
    const el = document.elementFromPoint(cx + o[0], cy + o[1]);
    if (el) { const r = test(el); if (r) return r; }
  }
  return null;
}
const OFFS_A = [[0,0],[6,0],[-6,0],[0,6],[0,-6],[10,10],[-10,-10],[10,-10],[-10,10]];
const OFFS_B = OFFS_A.concat([[14,0],[-14,0],[0,14],[0,-14]]);
const isOnModel = (x, y) => !!probe(x, y, OFFS_A, el => el.classList && el.classList.contains('face'));
const pickLimb  = (x, y) => probe(x, y, OFFS_B, el => el.closest && el.closest('[data-limb]'));

const stage = document.getElementById('stage');
const modelEl = document.getElementById('model');

let rotY = 30, rotX = -12, dragging = false, limbDrag = null;
let lastX = 0, lastY = 0, lastActive = 0;
const IDLE_DELAY = 1400, AUTO_SPEED = 0.32;

function applyRotation() {
  modelEl.style.transform = 'translateY(112px) rotateX(' + rotX + 'deg) rotateY(' + rotY + 'deg)';
}

function loop() {
  if (!dragging && !limbDrag && performance.now() - lastActive > IDLE_DELAY) {
    rotY += AUTO_SPEED;
    applyRotation();
  }
  requestAnimationFrame(loop);
}

stage.addEventListener('pointerdown', function (e) {
  if (e.target.closest('.stage-tools')) return;

  const limbEl = pickLimb(e.clientX, e.clientY);
  if (limbEl) {
    if (e.cancelable) e.preventDefault();
    const side = limbEl.dataset.limb;
    limbDrag = {side: side, sx: e.clientX, sy: e.clientY, ax: limbAngles[side].x, az: limbAngles[side].z};
    lastActive = performance.now();
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    return;
  }

  if (!isOnModel(e.clientX, e.clientY)) return;
  if (e.cancelable) e.preventDefault();
  dragging = true;
  lastX = e.clientX; lastY = e.clientY;
  lastActive = performance.now();
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
});

stage.addEventListener('pointermove', function (e) {
  if (limbDrag) {
    const clamp = v => Math.max(-90, Math.min(90, v));
    limbAngles[limbDrag.side].x = clamp(limbDrag.ax - (e.clientY - limbDrag.sy) * 0.6);
    limbAngles[limbDrag.side].z = clamp(limbDrag.az - (e.clientX - limbDrag.sx) * 0.6);
    applyLimbAngle(limbDrag.side);
    lastActive = performance.now();
    return;
  }
  if (!dragging) return;

  rotY += (e.clientX - lastX) * 0.55;
  rotX -= (e.clientY - lastY) * 0.45;
  rotX = Math.max(-78, Math.min(78, rotX));
  lastX = e.clientX; lastY = e.clientY;
  lastActive = performance.now();
  applyRotation();
});

function endDrag() {
  dragging = false;
  limbDrag = null;
  lastActive = performance.now();
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

applyRotation();
requestAnimationFrame(loop);

// 姿势：[armR.x, armR.z, armL.x, armL.z, legR.x, legR.z, legL.x, legL.z]
const POSES = {
  poseReset: [0, 0, 0, 0, 0, 0, 0, 0],
  poseWalk:  [-28, 0, 28, 0, 28, 0, -28, 0],
  poseRun:   [-55, 0, 55, 0, 50, 0, -50, 0],
  poseWave:  [-150, 25, 0, 0, 0, 0, 0, 0]
};
Object.keys(POSES).forEach(function (id) {
  document.getElementById(id).addEventListener('click', function () {
    const v = POSES[id];
    ['armR', 'armL', 'legR', 'legL'].forEach(function (s, i) {
      limbAngles[s].x = v[i * 2];
      limbAngles[s].z = v[i * 2 + 1];
      applyLimbAngle(s);
    });
    document.querySelectorAll('.stage-tools .tool-btn').forEach(b => b.classList.toggle('active', b === this));
  });
});

/* ---------- 生成与上传 ---------- */
function generate() {
  if (!srcCanvas) return;

  const skin = makeSkin(currentSize, currentSlim);   // 导出的是原色，不含预览明暗
  skinURL = skin.toDataURL();

  const cv = document.getElementById('skinCanvas');
  cv.width = cv.height = currentSize;
  const cx = cv.getContext('2d');
  cx.imageSmoothingEnabled = false;
  cx.clearRect(0, 0, currentSize, currentSize);
  cx.drawImage(skin, 0, 0);

  document.getElementById('avatarPreview').src = makeAvatar(skin).toDataURL();
  document.getElementById('uploadZone').classList.add('has-image');

  buildModel(currentSlim, skinURL);

  document.getElementById('downloadBtn').disabled = false;
  document.getElementById('skinMeta').textContent =
    currentSize + ' × ' + currentSize + ' PX  ·  ' + (currentSlim ? '纤细 (Alex)' : '经典 (Steve)');
}

const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');

uploadZone.addEventListener('click', function () { fileInput.click(); });

fileInput.addEventListener('change', function (e) {
  const f = e.target.files && e.target.files[0];
  if (f) handleFile(f);
  fileInput.value = '';
});

['dragenter', 'dragover'].forEach(function (ev) {
  uploadZone.addEventListener(ev, function (e) { e.preventDefault(); uploadZone.classList.add('dragover'); });
});
['dragleave', 'drop'].forEach(function (ev) {
  uploadZone.addEventListener(ev, function (e) { e.preventDefault(); uploadZone.classList.remove('dragover'); });
});
uploadZone.addEventListener('drop', function (e) {
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f && f.type.indexOf('image/') === 0) handleFile(f);
  else alert('请选择标准的图片文件（JPG / PNG / WEBP）');
});

function handleFile(file) {
  if (!file.type || file.type.indexOf('image/') !== 0) { alert('请选择有效的图像文件'); return; }
  const reader = new FileReader();
  reader.onload = function () {
    const img = new Image();
    img.onload = function () { srcCanvas = normalizeImage(img); generate(); };
    img.onerror = function () { alert('图像解析失败，请尝试其他文件'); };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function bindSegmented(id, onPick) {
  document.getElementById(id).addEventListener('click', function (e) {
    const btn = e.target.closest('button');
    if (!btn) return;
    Array.prototype.forEach.call(this.children, b => b.classList.toggle('active', b === btn));
    onPick(btn.dataset.val);
    if (srcCanvas) generate();
  });
}
bindSegmented('sizeGroup', v => { currentSize = parseInt(v, 10); });
bindSegmented('bodyGroup', v => { currentSlim = v === '1'; });

document.getElementById('downloadBtn').addEventListener('click', function () {
  const cv = document.getElementById('skinCanvas');
  const fileName = 'minecraft_skin_' + currentSize + 'x' + currentSize + (currentSlim ? '_slim' : '_classic') + '.png';
  cv.toBlob(function (blob) {
    if (!blob) return;
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = fileName;
    a.target = '_blank';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(blobUrl); }, 2000);
  }, 'image/png');
});
</script>
